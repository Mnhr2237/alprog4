<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Harga Sembako Kota Bandung 2025</title>
  <!-- CDN Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-emerald-700 text-white py-6 px-4 md:px-8 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-2">
          <i data-lucide="table"></i> Tabel Harga Sembako Kota Bandung 2025
        </h1>
        <p class="text-emerald-100 text-sm mt-1">Sistem Informasi Pantauan Harga Pangan Harian & Sebaran Pasar</p>
      </div>
      <div class="bg-emerald-800 px-4 py-2 rounded-lg text-xs border border-emerald-600">
        <p class="text-emerald-300">Sumber Rujukan:</p>
        <p class="font-semibold text-white">Priangan Jabar & Disdagin Bandung</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Area Filter & Search -->
    <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center">
      
      <!-- Input Search -->
      <div class="relative w-full md:w-80">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari komoditas (misal: Beras, Cabai)..." 
          class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
          onkeyup="filterData()"
        >
      </div>

      <!-- Filter Pasar & Urutkan -->
      <div class="flex flex-wrap w-full md:w-auto gap-3">
        <select 
          id="filterPasar" 
          onchange="filterData()" 
          class="px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700"
        >
          <option value="semua">Semua Pasar</option>
          <option value="sederhana">Pasar Sederhana</option>
          <option value="kosambi">Pasar Kosambi</option>
          <option value="ciroyom">Pasar Ciroyom</option>
          <option value="gedebage">Pasar Gedebage</option>
        </select>

        <select 
          id="sortHarga" 
          onchange="filterData()" 
          class="px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700"
        >
          <option value="default">Urutkan: Normal</option>
          <option value="termurah">Harga: Termurah</option>
          <option value="termahal">Harga: Termahal</option>
        </select>
      </div>

    </div>

    <!-- Tabel Data Sembako -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
              <th class="p-4">Komoditas</th>
              <th class="p-4">Satuan</th>
              <th class="p-4">Pasar Sederhana</th>
              <th class="p-4">Pasar Kosambi</th>
              <th class="p-4">Pasar Ciroyom</th>
              <th class="p-4">Pasar Gedebage</th>
              <th class="p-4 text-center">Rata-Rata Kota</th>
              <th class="p-4 text-center">Tren</th>
            </tr>
          </thead>
          <tbody id="tabelBody" class="divide-y divide-slate-100">
            <!-- Data akan diisi secara otomatis oleh JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Pesan jika data tidak ditemukan -->
      <div id="noData" class="hidden p-8 text-center text-slate-400">
        <i data-lucide="package-search" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
        <p>Komoditas yang Anda cari tidak ditemukan.</p>
      </div>
    </div>

  </main>

  <!-- Script Logika Data & Interaksi -->
  <script>
    // Data dummy sebaran harga sembako Kota Bandung 2025
    const dataSembako = [
      { nama: "Beras Medium", satuan: "Kg", sederhana: 13500, kosambi: 13800, ciroyom: 13000, gedebage: 12800, tren: "stabil" },
      { nama: "Beras Premium", satuan: "Kg", sederhana: 15500, kosambi: 15800, ciroyom: 15000, gedebage: 14800, tren: "stabil" },
      { nama: "Minyak Goreng Kemasan", satuan: "Liter", sederhana: 18000, kosambi: 18500, ciroyom: 17500, gedebage: 17000, tren: "naik" },
      { nama: "Minyakita", satuan: "Liter", sederhana: 15700, kosambi: 16000, ciroyom: 15500, gedebage: 15000, tren: "stabil" },
      { nama: "Gula Pasir", satuan: "Kg", sederhana: 17500, kosambi: 18000, ciroyom: 17000, gedebage: 17000, tren: "stabil" },
      { nama: "Daging Ayam Ras", satuan: "Kg", sederhana: 37000, kosambi: 38000, ciroyom: 35500, gedebage: 35000, tren: "naik" },
      { nama: "Daging Sapi Segar", satuan: "Kg", sederhana: 135000, kosambi: 140000, ciroyom: 130000, gedebage: 130000, tren: "stabil" },
      { nama: "Telur Ayam Ras", satuan: "Kg", sederhana: 29000, kosambi: 29500, ciroyom: 28500, gedebage: 28000, tren: "turun" },
      { nama: "Cabai Merah Keriting", satuan: "Kg", sederhana: 48000, kosambi: 50000, ciroyom: 45000, gedebage: 42000, tren: "naik" },
      { nama: "Cabai Rawit Merah", satuan: "Kg", sederhana: 55000, kosambi: 58000, ciroyom: 52000, gedebage: 50000, tren: "naik" },
      { nama: "Bawang Merah", satuan: "Kg", sederhana: 35000, kosambi: 36000, ciroyom: 32000, gedebage: 30000, tren: "turun" },
      { nama: "Bawang Putih (Honan)", satuan: "Kg", sederhana: 40000, kosambi: 42000, ciroyom: 38000, gedebage: 38000, tren: "stabil" }
    ];

    function formatRupiah(angka) {
      return 'Rp ' + angka.toLocaleString('id-ID');
    }

    function renderTable(dataset) {
      const tbody = document.getElementById('tabelBody');
      const noData = document.getElementById('noData');
      tbody.innerHTML = '';

      if (dataset.length === 0) {
        noData.classList.remove('hidden');
        return;
      } else {
        noData.classList.add('hidden');
      }

      dataset.forEach(item => {
        // Hitung rata-rata
        const rataRata = Math.round((item.sederhana + item.kosambi + item.ciroyom + item.gedebage) / 4);

        // Badge tren
        let badgeTren = '';
        if (item.tren === 'naik') {
          badgeTren = `<span class="px-2 py-1 text-xs bg-red-100 text-red-700 font-semibold rounded-full flex items-center justify-center gap-1"><i data-lucide="trending-up" class="w-3 h-3"></i> Naik</span>`;
        } else if (item.tren === 'turun') {
          badgeTren = `<span class="px-2 py-1 text-xs bg-emerald-100 text-emerald-700 font-semibold rounded-full flex items-center justify-center gap-1"><i data-lucide="trending-down" class="w-3 h-3"></i> Turun</span>`;
        } else {
          badgeTren = `<span class="px-2 py-1 text-xs bg-slate-100 text-slate-600 font-semibold rounded-full flex items-center justify-center gap-1"><i data-lucide="minus" class="w-3 h-3"></i> Stabil</span>`;
        }

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';
        tr.innerHTML = `
          <td class="p-4 font-semibold text-slate-800">${item.nama}</td>
          <td class="p-4 text-slate-500">${item.satuan}</td>
          <td class="p-4">${formatRupiah(item.sederhana)}</td>
          <td class="p-4">${formatRupiah(item.kosambi)}</td>
          <td class="p-4">${formatRupiah(item.ciroyom)}</td>
          <td class="p-4">${formatRupiah(item.gedebage)}</td>
          <td class="p-4 text-center font-bold text-emerald-700 bg-emerald-50/50">${formatRupiah(rataRata)}</td>
          <td class="p-4 text-center">${badgeTren}</td>
        `;
        tbody.appendChild(tr);
      });

      lucide.createIcons();
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const pasarFilter = document.getElementById('filterPasar').value;
      const sortOption = document.getElementById('sortHarga').value;

      let filtered = dataSembako.filter(item => item.nama.toLowerCase().includes(query));

      // Sorting berdasarkan harga rata-rata
      if (sortOption === 'termurah') {
        filtered.sort((a, b) => {
          const avgA = (a.sederhana + a.kosambi + a.ciroyom + a.gedebage) / 4;
          const avgB = (b.sederhana + b.kosambi + b.ciroyom + b.gedebage) / 4;
          return avgA - avgB;
        });
      } else if (sortOption === 'termahal') {
        filtered.sort((a, b) => {
          const avgA = (a.sederhana + a.kosambi + a.ciroyom + a.gedebage) / 4;
          const avgB = (b.sederhana + b.kosambi + b.ciroyom + b.gedebage) / 4;
          return avgB - avgA;
        });
      }

      renderTable(filtered);
    }

    // Inisialisasi awal
    renderTable(dataSembako);
  </script>
</body>
</html>
